# Build Micron cho Android → file APK cài thẳng lên điện thoại / máy tính bảng.
# Chạy tự động mỗi lần đẩy code lên main, hoặc bấm "Run workflow" trong tab Actions.
# Tải APK: Actions → lần chạy mới nhất → mục Artifacts → "Micron-Android-APK".
name: Android APK
on:
  workflow_call:
  push:
    branches: [main]
    paths: ["web/**", "mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run copy-web && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk Micron-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: Micron-Android-APK, path: mobile/Micron-*.apk }
