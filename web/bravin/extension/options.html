<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Micron ↔ Bravin</title>
<style>
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;width:380px;padding:14px;margin:0;background:#0e1016;color:#e6e8ee}
h3{margin:0 0 4px;display:flex;align-items:center;gap:8px}h3 img{width:22px;height:22px}
p{margin:0 0 10px;color:#8b93a5;font-size:12px}
label{display:block;font-size:12px;color:#8b93a5;margin-top:8px}
input,select,button{width:100%;box-sizing:border-box;padding:8px;margin:4px 0;font:inherit;border-radius:8px;border:1px solid #2a2f3a;background:#171a21;color:#e6e8ee}
input:focus,select:focus{outline:none;border-color:#7c5cff}
button{background:#6447f0;border-color:#6447f0;color:#fff;cursor:pointer;margin-top:12px}
#st{display:block;margin-top:8px;font-size:12px;color:#8b93a5}
</style></head>
<body>
<h3><img src="icons/48.png" alt="">Micron ↔ Bravin</h3>
<p>Gửi kết quả từ Micron thẳng sang Bravin, và chuột phải → “Gửi sang Bravin” trên mọi trang.</p>
<label>Địa chỉ Bravin của đội<input id="u" placeholder="https://bravin.example.com/"></label>
<label>Địa chỉ Micron<input id="mu" placeholder="https://vtvcab17-max.github.io/micron/"></label>
<label>Chuột phải → Gửi sang Bravin sẽ<select id="m"><option value="link">Mở hộp “Tải về từ link” (khuyên dùng)</option><option value="import">Tải thẳng vào Thư viện</option></select></label>
<button id="s">Lưu và cấp quyền</button><span id="st"></span>
<script src="options.js"></script>
</body></html>
